<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101116"><title>TicketNXT — لوحة التحكم</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#171920;--line:#292d38;--muted:#9298a8;--text:#f4f5f8;--accent:#8794ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#28305a55,transparent 38%),var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif;min-height:100vh}button,a{font:inherit;cursor:pointer}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(850px,100%);background:linear-gradient(145deg,#1c2030,#15171f);border:1px solid #343b63;border-radius:24px;padding:32px;box-shadow:0 24px 80px #0006}.center{text-align:center;width:min(460px,100%)}.logo{width:76px;height:76px;border-radius:22px;object-fit:cover;margin-bottom:16px}.login-card h1{font-size:28px;margin:0 0 8px}.login-card p{color:#aeb4c6;line-height:1.8;margin:0 0 22px}.primary{display:inline-flex;justify-content:center;align-items:center;background:#5865f2;color:white;text-decoration:none;border:0;border-radius:12px;padding:13px 20px;font-weight:800;width:100%}.hint{font-size:12px;color:#8991a5;margin-top:16px}.error{color:#ffaaaa;font-size:13px;margin-top:14px}.guild-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;margin-top:22px}.guild{display:flex;align-items:center;gap:12px;background:#1d2029;border:1px solid var(--line);border-radius:14px;padding:13px}.guild img,.guild-icon{width:46px;height:46px;border-radius:13px;object-fit:cover;display:grid;place-items:center;background:#30364c}.guild-info{min-width:0;flex:1}.guild-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.guild-info small{color:var(--muted)}.guild button,.minor{border:0;border-radius:9px;background:#5865f2;color:white;padding:9px 12px;font-weight:700}.guild button:disabled{background:#343947;color:#9298a8;cursor:not-allowed}.topline{display:flex;align-items:center;gap:14px;margin-bottom:22px}.topline .logo{width:54px;height:54px;margin:0}.topline .minor{margin-right:auto;background:#30364c}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{border-left:1px solid var(--line);background:#12141bd9;padding:26px 18px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;border-radius:14px}.brand strong{font-size:20px}.brand small{display:block;color:var(--muted);font-size:12px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aeb3c1;text-align:right;padding:12px;border-radius:11px}.nav button.active{background:#8794ff1c;color:#b8c0ff}.side-bottom{margin-top:auto;color:var(--muted);font-size:12px}.side-bottom strong{display:block;color:white;margin-top:5px}main{padding:34px clamp(20px,4vw,58px);max-width:1400px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.eyebrow{color:#a5adff;font-size:13px;font-weight:700}.top h1{font-size:29px;margin:5px 0 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.panel p{color:var(--muted)}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.metric{font-size:24px;font-weight:800;margin-top:12px}.muted{color:var(--muted);font-size:13px}.welcome{border:1px solid #343b63;background:linear-gradient(110deg,#202743,#1a1d2a);border-radius:18px;padding:25px}.welcome p{margin-bottom:0}.notice{margin-top:18px;padding:12px;border-radius:10px;background:#8794ff12;color:#c0c7ff;font-size:13px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{padding:14px;border-left:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-bottom{display:none}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.login-card{padding:24px 18px}}
</style></head><body><div id="app"><div class="login-wrap"><div class="login-card center"><img class="logo" src="https://cdn.discordapp.com/icons/1260838143276355608/d6d3fa730739dd1f29b9a38dea305978.webp?size=256"><h1>TicketNXT</h1><p>لوحة تحكم نظام التكت.<br>سجّل دخولك عبر Discord لإدارة السيرفرات التي تملك صلاحية إدارتها.</p><a class="primary" href="/auth/discord">◉ تسجيل الدخول عبر Discord</a><div class="hint">لن نطلب كلمة مرور Discord منك داخل الموقع.</div></div></div></div>
<script>
const app=document.getElementById("app"),logo="https://cdn.discordapp.com/icons/1260838143276355608/d6d3fa730739dd1f29b9a38dea305978.webp?size=256";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"request_failed");return d}
function login(msg=""){app.innerHTML=`<div class="login-wrap"><div class="login-card center"><img class="logo" src="${logo}"><h1>TicketNXT</h1><p>لوحة تحكم نظام التكت.<br>سجّل دخولك عبر Discord لإدارة السيرفرات التي تملك صلاحية إدارتها.</p><a class="primary" href="/auth/discord">◉ تسجيل الدخول عبر Discord</a><div class="hint">لن نطلب كلمة مرور Discord منك داخل الموقع.</div><div class="error">${esc(msg)}</div></div></div>`}
function guilds(d){app.innerHTML=`<div class="login-wrap"><div class="login-card"><div class="topline"><img class="logo" src="${esc(d.user.avatar||logo)}"><div><h1>${esc(d.user.globalName)}</h1><p>اختر السيرفر الذي تريد إدارته</p></div><button class="minor" id="logout">خروج</button></div><div class="guild-grid">${(d.guilds||[]).map(g=>`<div class="guild">${g.icon?`<img src="${esc(g.icon)}">`:'<div class="guild-icon">◈</div>'}<div class="guild-info"><strong>${esc(g.name)}</strong><small>${g.owner?"مالك السيرفر":"صلاحية إدارة السيرفر"}</small></div><button data-id="${esc(g.id)}" ${g.botInstalled?"":"disabled"}>${g.botInstalled?"اختيار":"أضف البوت أولاً"}</button></div>`).join("")||'<p>لم نعثر على سيرفرات تملك صلاحية إدارتها.</p>'}</div><div class="hint">السيرفرات التي لا يوجد فيها TicketNXT ستظهر معطّلة حتى تضيف البوت إليها.</div><div class="error" id="err"></div></div></div>`;document.getElementById("logout").onclick=logout;document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>choose(b.dataset.id,b))}
async function choose(id,b){b.disabled=true;try{await api("/api/select-guild",{method:"POST",body:JSON.stringify({guildId:id})});const d=await api("/api/me");dashboard(d)}catch{document.getElementById("err").textContent="تعذر اختيار السيرفر. حاول مجددًا.";b.disabled=false}}
function dashboard(d){const g=d.guilds.find(x=>x.id===d.selectedGuildId);app.innerHTML=`<div class="layout"><aside><div class="brand"><img src="${logo}"><div><strong>TicketNXT</strong><small>لوحة إدارة البوت</small></div></div><nav class="nav"><button class="active" data-view="home">نظرة عامة</button><button data-view="tickets">نظام التكت</button><button data-view="settings">الإعدادات</button></nav><div class="side-bottom">إصدار اللوحة<strong>v0.1.0</strong></div></aside><main><div class="top"><div><div class="eyebrow">TICKETNXT / CONTROL CENTER</div><h1 id="heading">نظرة عامة</h1></div><div><b>${esc(d.user.globalName)}</b> <button class="minor" id="switch">تغيير السيرفر</button> <button class="minor" id="logout2">خروج</button></div></div><section id="home" class="view active"><div class="welcome"><h2>مرحباً بك في TicketNXT</h2><p>السيرفر الحالي: ${esc(g?.name||"—")}</p></div><div class="cards"><div class="card">حالة البوت<div class="metric" id="bot">...</div></div><div class="card">نظام التكت<div class="metric">غير مُعدّ</div><div class="muted">بانتظار إنشاء أول لوحة</div></div><div class="card">السيرفر المحدد<div class="metric">${esc(g?.name||"—")}</div></div></div><div class="notice">تم ربط حساب Discord واختيار السيرفر. الخطوة التالية هي بناء محرر التكت.</div></section><section id="tickets" class="view"><div class="panel"><h2>نظام التكت</h2><p>محرر اللوحات قيد التجهيز.</p></div></section><section id="settings" class="view"><div class="panel"><h2>الإعدادات</h2><p>الإعدادات العامة قيد التجهيز.</p></div></section></main></div>`;const nav=[...document.querySelectorAll("[data-view]")];nav.forEach(b=>b.onclick=()=>{nav.forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===b.dataset.view));document.getElementById("heading").textContent=b.textContent});document.getElementById("switch").onclick=()=>guilds(d);document.getElementById("logout2").onclick=logout;refresh()}
async function refresh(){try{const s=await api("/api/status");const el=document.getElementById("bot");if(el)el.textContent=s.bot==="online"?"متصل":"غير متصل"}catch{}}
async function logout(){await fetch("/auth/logout",{method:"POST",credentials:"same-origin"});login()}
(async()=>{try{const d=await api("/api/me");if(!d.oauthConfigured)login("يلزم إعداد مفاتيح Discord OAuth في الاستضافة.");else if(!d.authenticated)login(new URLSearchParams(location.search).has("login")?"تم إلغاء تسجيل الدخول.":"");else if(d.selectedGuildId)dashboard(d);else guilds(d)}catch{login("تعذر تحميل لوحة التحكم. حدّث الصفحة.")}})();
</script></body></html>
