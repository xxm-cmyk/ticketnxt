<style>

main{min-width:0;padding:28px clamp(18px,3vw,44px) 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:27px}.crumb{font-size:11px;color:#8290a8;letter-spacing:1.5px;font-weight:800}.topbar h1{margin:4px 0 0;font-size:29px;font-weight:900}.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.server-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#111720;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}.server-chip img{width:22px;height:22px;border-radius:7px}.view{display:none}.view.active{display:block}.hero{position:relative;overflow:hidden;border:1px solid #2a3853;border-radius:20px;padding:27px;background:linear-gradient(115deg,#17243a,#111925 62%,#111720);margin-bottom:16px}.hero:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #526da633;border-radius:50%;left:-70px;top:-120px;box-shadow:0 0 0 30px #526da60b,0 0 0 65px #526da608}.hero-tag{display:inline-flex;align-items:center;gap:7px;color:#a8bbff;background:#24375a;border:1px solid #344b77;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #49c69a}.hero h2{font-size:26px;margin:14px 0 5px;font-weight:900}.hero p{color:#a5b1c4;margin:0;line-height:1.8;max-width:680px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{border:1px solid var(--line);border-radius:15px;padding:17px;background:linear-gradient(145deg,#141a24,#10141c)}.stat-top{display:flex;justify-content:space-between;color:#9ba7b9;font-size:13px}.stat-icon{width:31px;height:31px;border-radius:10px;background:#202d45;display:grid;place-items:center;color:#a9beff}.stat strong{display:block;font-size:25px;margin-top:13px;font-weight:900}.stat small{color:#778397}.content-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr);gap:14px}.card{b .v2-button.s2{background:#4b4e57}.v2-button.s3{background:#24834f}.v2-button.s4{background:#b83f4b}.v2-button.s5{background:#3b3e47}.preview-foot{font-size:11px;color:#8792a5;margin-top:10px;line-height:1.6}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.status{font-size:13px;margin-top:12px;color:#ffabb1;min-height:20px}.status.ok{color:#8ee5c5}.option-list{display:grid;gap:10px}.empty{padding:25px;text-align:center;color:#8994a7;border:1px dashed #354154;border-radius:12px}.channel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.toggle{display:flex;align-items:center;gap:9px;color:#cbd4e2;font-size:13px}.toggle input{accent-color:#718dff;width:16px;height:16px}.toast{position:fixed;bottom:22px;left:22px;z-index:10;background:#182d29;border:1px solid #2c6758;color:#b0f0d9;border-radius:12px;padding:12px 16px;box-shadow:0 12px 35px #0008}

.v2-select{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:10px 13px;border:1px solid #454b59;border-radius:7px;background:#30333c;color:#e3e6ed;font-size:13px}
@media(max-width:720px){
 html,body,#app{max-width:100%;overflow-x:hidden}

 .brand{padding:0 4px 9px;gap:9px}.brand img{width:34px;height:34px}.brand b{font-size:17px}

<body><div id="app" class="app"><div class="auth-wrap"><div class="auth-card"><img class="logo" src="https://cdn.discordapp.com/icons/1260838143276355608/d6d3fa730739dd1f29b9a38dea305978.webp?size=256"><h1>TicketNXT</h1><p>مركز إدارة التذاكر لسيرفرات Discord.<br>إدارة واضحة، إعدادات دقيقة، وتجربة بدون تعقيد.</p><a class="primary-link" href="/auth/discord">◉　المتابعة باستخدام Discord</a><div class="auth-note">لن نطلب كلمة مرور Discord منك داخل هذه اللوحة.</div></div></div></div>
<script>
"use strict";
const app=document.getElementById("app"),logo="https://cdn.discordapp.com/icons/1260838143276355608/d6d3fa730739dd1f29b9a38dea305978.webp?size=256";
let me=null,meta=null,config=null,currentView="home",dirty=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||"request_failed");return d}
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3000)}
function errorText(e){const m={login_required:"انتهت الجلسة. سجّل الدخول مجدداً.",guild_not_selected:"اختر سيرفراً أولاً.",manage_guild_required:"تحتاج صلاحية إدارة السيرفر.",bot_missing_permissions:"البوت لا يملك الصلاحيات المطلوبة في القناة.",invalid_channel:"القناة المحددة غير صالحة.",meta_load_failed:"تعذر تحميل بيانات السيرفر."};return m[e]||e||"حدث خطأ غير متوقع."}
async function logout(){try{await fetch("/auth/logout",{method:"POST",credentials:"same-origin"})}finally{location.href="/"}}
function showLogin(msg){app.innerHTML='<div class="auth-wrap"><div class="auth-card"><img class="logo" src="'+logo+'"><h1>TicketNXT</h1><p>مركز إدارة التذاكر لسيرفرات Discord.<br>إدارة واضحة، إعدادات دقيقة، وتجربة بدون تعقيد.</p><a class="primary-link" href="/auth/discord">◉　المتابعة باستخدام Discord</a><div class="auth-note">لن نطلب كلمة مرور Discord منك داخل هذه اللوحة.</div><div class="auth-error">'+esc(msg||"")+'</div></div></div>'}
function renderGuilds(){app.innerHTML='<div class="guild-wrap"><div class="guild-head"><img src="'+esc(me.user.avatar||logo)+'"><div style="flex:1"><h1>أهلاً، '+esc(me.user.globalName||me.user.username)+'</h1><p>اختر السيرفر الذي تريد إدارة نظام التكت فيه.</p></div><button class="btn secondary sm" id="logout">تسجيل الخروج</button></div><div class="guild-grid">'+(me.guilds||[]).map(g=>'<div class="guild-card"><div class="guild-icon">'+(g.icon?'<img src="'+esc(g.icon)+'">':"◈")+'</div><div class="guild-meta"><strong>'+esc(g.name)+'</strong><small>'+(g.owner?"مالك السيرفر":"صلاحية إدارة السيرفر")+'</small></div><button class="btn sm" data-guild="'+esc(g.id)+'" '+(g.botInstalled?"":"disabled")+'>'+(g.botInstalled?"فتح":"أضف البوت")+'</button></div>').join("")+'</div><p class="hint small" style="margin-top:18px">السيرفرات التي لم تتم إضافة البوت إليها تظهر كخيارات غير متاحة.</p><div id="guildError" class="status"></div></div>';$("logout").onclick=logout;document.querySelectorAll("[data-guild]").forEach(b=>b.onclick=()=>chooseGuild(b.dataset.guild,b))}
async function chooseGuild(id,b){b.disabled=true;try{await api("/api/select-guild",{method:"POST",body:JSON.stringify({guildId:id})});me=await api("/api/me");await loadMeta();renderDashboard()}catch(e){$("guildError").textContent=errorText(e.message);b.disabled=false}}
async function loadMeta(){meta=await api("/api/ticket/meta");config=clone(meta.config);config.panel=config.panel||{};config.panel.options=Array.isArray(config.panel.options)?config.panel.options:[];config.panel.components=Array.isArray(config.panel.components)?config.panel.components:[];config.overrideRoleIds=config.overrideRoleIds||[]}

function renderPreview(){const el=$("livePreview");if(!el)return;const p=config.panel;const body=(p.components||[]).map(c=>{if(c.type==="text")return '<div class="v2-text">'+esc(c.content)+'</div>';if(c.type==="separator")return c.divider===false?'<div style="height:12px"></div>':'<div class="v2-separator"></div>';if(c.type==="media")return '<div class="v2-gallery">'+(c.items||[]).map(x=>x.url?'<img src="'+esc(x.url)+'" alt="">':"").join("")+'</div>';if(c.type==="section")return '<div class="v2-section"><div>'+esc(c.content)+'</div>'+(c.accessoryType==="thumbnail"?(c.url?'<img src="'+esc(c.url)+'" alt="">':""):'<span class="v2-button">'+esc(c.emoji||"")+' '+esc(c.label||"زر")+'</span>')+'</div>';if(c.type==="select")return '<div class="v2-select">'+esc(c.placeholder||"اختر نوع التذكرة")+'　⌄</div>';if(c.type==="button")return '<span class="v2-button s'+Number(c.style||1)+'">'+esc(c.emoji||"")+' '+esc(c.label||"زر")+'</span>';return ""}).join("");el.innerHTML='<div class="discord-user"><img src="'+logo+'"> <b>TicketNXT</b> <span style="color:#8f96a5">BOT</span></div><div class="v2-container">'+(p.title?'<div class="v2-title">'+esc(p.title)+'</div>':"")+(p.description?'<div class="v2-text">'+esc(p.description)+'</div>':"")+(body+((p.components||[]).some(c=>c.type==="select")?"":'<div class="v2-select">اختر نوع التذكرة　⌄</div>'))||'<div class="preview-foot">أضف مكونات لتظهر هنا.</div>')+'</div>'}
function setStatus(id,msg,ok){const e=$(id);if(e){e.textContent=msg;e.className="status"+(ok?" ok":"")}}
async function saveConfig(){try{const transcript=$("transcriptChannel");if(transcript)config.transcriptChannelId=transcript.value||null;setStatus("editorStatus","جارٍ حفظ التغييرات...",true);const result=await api("/api/ticket/config",{method:"PUT",body:JSON.stringify(config)});config=result.config;dirty=false;setStatus("editorStatus","تم حفظ الإعدادات.",true);toast("تم حفظ الإعدادات");return true}catch(e){setStatus("editorStatus",errorText(e.message),false);return false}}
async function publishPanel(){const channelId=$("publishChannel").value;if(!channelId)return setStatus("editorStatus","اختر قناة النشر أولاً.",false);config.transcriptChannelId=$("transcriptChannel").value||null;if(!await saveConfig())return;try{setStatus("editorStatus","جارٍ نشر اللوحة في Discord...",true);const result=await api("/api/ticket/publish",{method:"POST",body:JSON.stringify({channelId})});config.panelChannelId=result.channelId;config.panelMessageId=result.messageId;setStatus("editorStatus","تم نشر اللوحة بنجاح.",true);toast("تم نشر لوحة التكت")}catch(e){setStatus("editorStatus",errorText(e.message),false)}}
async function renderTranscripts(){
 const root=$("view-transcripts");
 root.innerHTML='<div class="section-title">أرشيف المحادثات</div><p class="section-sub">كل التذاكر المغلقة محفوظة هنا، ويمكنك فتح أي محادثة ومراجعة الرسائل والمرفقات.</p><div class="card"><div class="transcript-toolbar"><span class="small muted" id="transcriptCount">جارٍ تحميل الأرشيف...</span><button class="btn secondary sm" id="refreshTranscripts">تحديث</button></div><div id="transcriptList" class="transcript-list"></div></div>';
 $("refreshTranscripts").onclick=renderTranscripts;
 try{
  const data=await api("/api/ticket/transcripts");
  const list=$("transcriptList");
  $("transcriptCount").textContent=(data.transcripts||[]).length+" محادثة محفوظة";
  if(!data.transcripts?.length){list.innerHTML='<div class="empty">لا توجد محادثات مؤرشفة بعد. ستظهر هنا تلقائياً بعد إغلاق أول تكت.</div>';return}
  list.innerHTML=data.transcripts.map(x=>'<div class="transcript-row"><div class="quick-icon">▤</div><div><strong>تكت #'+esc(x.number)+' — '+esc(x.optionLabel||"تذكرة")+'</strong><small>العضو: '+esc(x.userId)+' · '+Number(x.messageCount||0)+' رسالة · '+(x.closedAt?new Date(x.closedAt).toLocaleString("ar-SA"):"غير مغلقة")+'</small></div><button class="btn secondary sm" data-transcript="'+esc(x.channelId)+'">عرض المحادثة</button></div>').join("");
  list.querySelectorAll("[data-transcript]").forEach(b=>b.onclick=()=>openTranscript(b.dataset.transcript));
 }catch(e){$("transcriptCount").textContent="تعذر تحميل الأرشيف";$("transcriptList").innerHTML='<div class="empty">'+esc(errorText(e.message))+'</div>'}
}
async function openTranscript(channelId){
 const root=$("view-transcripts");
 root.innerHTML='<div class="empty">جارٍ تحميل المحادثة...</div>';
 try{
  const data=await api("/api/ticket/transcripts/"+encodeURIComponent(channelId));
  const x=data.ticket;
  const fmt=v=>v?new Date(v).toLocaleString("ar-SA"):"—";
  const messages=(data.messages||[]).map(m=>{
   const avatar=m.avatarUrl?'<img src="'+esc(m.avatarUrl)+'" alt="">':'<div class="quick-icon">◉</div>';
   const content=m.content?'<div class="transcript-content">'+esc(m.content)+'</div>':"";
   const files=(m.attachments||[]).map(a=>'<a href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer">📎 '+esc(a.name||"مرفق")+'</a>').join("");
   const embeds=(m.embeds||[]).map(e=>'<div class="transcript-embed">'+(e.title?'<b>'+esc(e.title)+'</b>':"")+(e.description?'<div class="transcript-content">'+esc(e.description)+'</div>':"")+(e.url?'<a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">فتح الرابط</a>':"")+'</div>').join("");
   return '<article class="transcript-message">'+avatar+'<div class="transcript-message-body"><div class="transcript-message-head"><strong>'+esc(m.authorName||"مستخدم")+(m.bot?' · BOT':"")+'</strong><time>'+fmt(m.timestamp)+'</time></div>'+content+embeds+(files?'<div class="transcript-attachments">'+files+'</div>':"")+'</div></article>';
  }).join("");
  root.innerHTML='<div class="transcript-toolbar"><button class="btn secondary sm" id="backTranscripts">← العودة للأرشيف</button><span class="pill">محادثة محفوظة</span></div><div class="card"><div class="section-title">تكت #'+esc(x.number)+' — '+esc(x.optionLabel||"تذكرة")+'</div><div class="transcript-meta"><span>صاحب التكت: '+esc(x.userId)+'</span><span>فتح: '+fmt(x.openedAt)+'</span><span>إغلاق: '+fmt(x.closedAt)+'</span><span>حفظ: '+fmt(x.savedAt)+'</span></div>'+(x.reason?'<p class="small muted">سبب التذكرة: '+esc(x.reason)+'</p>':"")+'</div><div class="transcript-messages">'+(messages||'<div class="empty">لا توجد رسائل في هذه المحادثة.</div>')+'</div>';
  $("backTranscripts").onclick=renderTranscripts;
 }catch(e){root.innerHTML='<div class="transcript-toolbar"><button class="btn secondary sm" id="backTranscripts">← العودة للأرشيف</button></div><div class="empty">'+esc(errorText(e.message))+'</div>';$("backTranscripts").onclick=renderTranscripts}
}
function renderSettings(){$("view-settings").innerHTML='<div class="section-title">إعدادات نظام التكت</div><p class="section-sub">خيارات الإدارة العامة التي تؤثر على التذاكر في هذا السيرفر.</p><div class="stack"><div class="card"><div class="card-head"><h3>رتب التجاوز</h3><span class="small muted">صلاحية إشراف إضافية</span></div><p class="small muted">هذه الرتب تستطيع رؤية التذاكر وتنفيذ إجراءات الإدارة حتى لو لم تكن ضمن فريق القسم.</p><div class="field"><label>اختر الرتب الموثوقة</label><select id="overrideRoles" multiple>'+roleOptions(config.overrideRoleIds||[])+'</select></div><div class="toolbar"><button class="btn" id="saveSettings">حفظ الإعدادات</button></div><div id="settingsStatus" class="status"></div></div><div class="card"><div class="card-head"><h3>متطلبات تشغيل النظام</h3><span class="pill">معلومات</span></div><div class="step"><span class="step-num">✓</span><div><b>صلاحيات البوت</b><small>إدارة القنوات، عرض القنوات، إرسال الرسائل، قراءة سجل الرسائل، وإرفاق الملفات.</small></div></div><div class="step"><span class="step-num">!</span><div><b>Transcript كامل</b><small>يطلب البوت Message Content Intent لقراءة الرسائل، ثم يحفظ نسخة المحادثة في أرشيف لوحة TicketNXT قبل حذف قناة التكت.</small></div></div><div class="step"><span class="step-num">⌑</span><div><b>حفظ البيانات</b><small>إعدادات السيرفر والتذاكر تحفظ في مساحة بيانات الاستضافة، ولا تُعرض ضمن ملفات الواجهة.</small></div></div></div></div>';$("saveSettings").onclick=async()=>{config.overrideRoleIds=[...$("overrideRoles").selectedOptions].map(o=>o.value);try{const result=await api("/api/ticket/config",{method:"PUT",body:JSON.stringify(config)});config=result.config;setStatus("settingsStatus","تم حفظ الإعدادات.",true);toast("تم حفظ الإعدادات")}catch(e){setStatus("settingsStatus",errorText(e.message),false)}}}
async function boot(){try{me=await api("/api/me");if(!me.oauthConfigured)return showLogin("يلزم إعداد Discord OAuth في الاستضافة.");if(!me.authenticated)return showLogin(new URLSearchParams(location.search).has("login")?"تم إلغاء تسجيل الدخول.":"");if(me.selectedGuildId){await loadMeta();renderDashboard()}else renderGuilds()}catch(e){showLogin("تعذر تحميل لوحة التحكم. حدّث الصفحة وحاول مجدداً.")}}
function renderDashboard(){shell()}
boot();
</script></body></html>
