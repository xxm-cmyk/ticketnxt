<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101116"><title>TicketNXT — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#171a23;--panel2:#1d2130;--line:#2a3040;--muted:#9aa2b4;--text:#f4f5f8;--accent:#8794ff;--danger:#e16e79;--good:#53c99a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#28305a55,transparent 38%),var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(850px,100%);background:linear-gradient(145deg,#1c2030,#15171f);border:1px solid #343b63;border-radius:24px;padding:32px;box-shadow:0 24px 80px #0006}.center{text-align:center;width:min(460px,100%)}.logo{width:76px;height:76px;border-radius:22px;object-fit:cover;margin-bottom:16px}.login-card h1{font-size:28px;margin:0 0 8px}.login-card p{color:#aeb4c6;line-height:1.8;margin:0 0 22px}.primary,.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:#5865f2;color:white;text-decoration:none;border:0;border-radius:11px;padding:11px 16px;font-weight:800}.primary{width:100%;padding:13px 20px}.btn.secondary{background:#30364c;color:#dce0ef}.btn.ghost{background:#242938;color:#cbd0df}.btn.danger{background:#6d303b;color:#ffd7dc}.btn.small{padding:7px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:12px;color:#8991a5;margin-top:16px}.error{color:#ffaaaa;font-size:13px;margin-top:14px}.guild-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;margin-top:22px}.guild{display:flex;align-items:center;gap:12px;background:#1d2029;border:1px solid var(--line);border-radius:14px;padding:13px}.guild img,.guild-icon{width:46px;height:46px;border-radius:13px;object-fit:cover;display:grid;place-items:center;background:#30364c}.guild-info{min-width:0;flex:1}.guild-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.guild-info small{color:var(--muted)}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}aside{border-left:1px solid var(--line);background:#12141bd9;padding:24px 16px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:43px;height:43px;border-radius:13px}.brand strong{font-size:20px}.brand small{display:block;color:var(--muted);font-size:12px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aeb3c1;text-align:right;padding:12px;border-radius:10px}.nav button.active{background:#8794ff1c;color:#c2c8ff}.side-bottom{margin-top:auto;color:var(--muted);font-size:12px}.side-bottom strong{display:block;color:white;margin-top:5px}
main{padding:30px clamp(16px,3vw,42px);max-width:1550px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{color:#a5adff;font-size:12px;font-weight:800;letter-spacing:.5px}.top h1{font-size:27px;margin:5px 0 0}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.view{display:none}.view.active{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px}.panel h2,.panel h3{margin-top:0}.panel p{color:var(--muted)}.welcome{border:1px solid #343b63;background:linear-gradient(110deg,#202743,#1a1d2a);border-radius:18px;padding:24px}.welcome p{margin-bottom:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:15px}.metric-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.metric{font-size:22px;font-weight:800;margin-top:10px}.muted{color:var(--muted);font-size:13px}.notice{margin-top:16px;padding:12px;border-radius:10px;background:#8794ff12;color:#c0c7ff;font-size:13px}
.editor-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.8fr);gap:16px;align-items:start}.stack{display:grid;gap:14px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#c4cada;font-weight:700}.field input,.field textarea,.field select{width:100%;background:#10131b;color:var(--text);border:1px solid #33394a;border-radius:9px;padding:10px 11px;outline:none;min-width:0}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}.field select[multiple]{min-height:105px}.field small{color:var(--muted);font-size:11px}.checkline{display:flex;align-items:center;gap:9px;color:#cdd2df;font-size:13px}.checkline input{accent-color:#8794ff;width:16px;height:16px}.option-card{background:#12151e;border:1px solid #303647;border-radius:13px;padding:15px;margin-top:12px}.option-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}.option-head strong{flex:1}.option-head .btn{padding:5px 8px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h3{margin:0}.preview-wrap{position:sticky;top:18px}.discord-preview{background:#313338;border-radius:12px;padding:18px;color:#dbdee1;min-height:220px}.preview-author{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px}.preview-author img{width:26px;height:26px;border-radius:50%}.preview-embed{border-left:4px solid #5865f2;background:#2b2d31;border-radius:4px;padding:13px;max-width:520px}.preview-embed h3{margin:0 0 8px;font-size:17px;color:#fff}.preview-embed p{margin:0 0 10px;color:#dbdee1;white-space:pre-wrap;overflow-wrap:anywhere}.preview-embed img{max-width:100%;max-height:180px;object-fit:cover;border-radius:5px}.preview-options{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.preview-option{background:#5865f2;color:white;padding:7px 11px;border-radius:6px;font-size:12px}.preview-select{background:#1e1f22;border:1px solid #555;padding:9px 12px;border-radius:6px;color:#ddd;width:100%;margin-top:10px}.preview-v2{border:1px solid #41465a;border-radius:10px;padding:14px;background:#242630}.preview-v2 .v2-accent{height:3px;background:#5865f2;border-radius:4px;margin:-14px -14px 13px}.preview-caption{font-size:11px;color:#aeb4c6;margin-top:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}.published{color:var(--good)}.danger-text{color:#ff9da7}.subtle{color:var(--muted);font-size:12px;line-height:1.7}.pill{display:inline-block;padding:4px 8px;background:#8794ff18;color:#bdc5ff;border-radius:20px;font-size:11px}
@media(max-width:1050px){.editor-grid{grid-template-columns:1fr}.preview-wrap{position:static}.layout{grid-template-columns:205px 1fr}}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{padding:12px;border-left:0;border-bottom:1px solid var(--line);gap:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-bottom{display:none}main{padding:18px 12px}.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.field-grid{grid-template-columns:1fr}.login-card{padding:24px 18px}}
</style></head>
<body>
<div id="app"><div class="login-wrap"><div class="login-card center"><img class="logo" src="https://cdn.discordapp.com/icons/1260838143276355608/d6d3fa730739dd1f29b9a38dea305978.webp?size=256"><h1>TicketNXT</h1><p>لوحة تحكم نظام التكت.<br>سجّل دخولك عبر Discord لإدارة السيرفرات التي تملك صلاحية إدارتها.</p><a class="primary" href="/auth/discord">◉ تسجيل الدخول عبر Discord</a><div class="hint">لن نطلب كلمة مرور Discord منك داخل الموقع.</div></div></div></div>
<script>
const app=document.getElementById("app"),logo="https://cdn.discordapp.com/icons/1260838143276355608/d6d3fa730739dd1f29b9a38dea305978.webp?size=256";
let me=null,meta=null,config=null,currentView="home";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||"request_failed");return d}
function login(msg=""){app.innerHTML=`<div class="login-wrap"><div class="login-card center"><img class="logo" src="${logo}"><h1>TicketNXT</h1><p>لوحة تحكم نظام التكت.<br>سجّل دخولك عبر Discord لإدارة السيرفرات التي تملك صلاحية إدارتها.</p><a class="primary" href="/auth/discord">◉ تسجيل الدخول عبر Discord</a><div class="hint">لن نطلب كلمة مرور Discord منك داخل الموقع.</div><div class="error">${esc(msg)}</div></div></div>`}
function guilds(d){app.innerHTML=`<div class="login-wrap"><div class="login-card"><div class="topline" style="display:flex;align-items:center;gap:14px;margin-bottom:22px"><img class="logo" style="width:54px;height:54px;margin:0" src="${esc(d.user.avatar||logo)}"><div style="flex:1"><h1>${esc(d.user.globalName)}</h1><p>اختر السيرفر الذي تريد إدارته</p></div><button class="btn secondary" id="logout">خروج</button></div><div class="guild-grid">${(d.guilds||[]).map(g=>`<div class="guild">${g.icon?`<img src="${esc(g.icon)}">`:'<div class="guild-icon">◈</div>'}<div class="guild-info"><strong>${esc(g.name)}</strong><small>${g.owner?"مالك السيرفر":"صلاحية إدارة السيرفر"}</small></div><button class="btn small" data-id="${esc(g.id)}" ${g.botInstalled?"":"disabled"}>${g.botInstalled?"اختيار":"أضف البوت أولاً"}</button></div>`).join("")||'<p>لم نعثر على سيرفرات تملك صلاحية إدارتها.</p>'}</div><div class="hint">السيرفرات التي لا يوجد فيها TicketNXT ستظهر معطّلة حتى تضيف البوت إليها.</div><div class="error" id="err"></div></div></div>`;document.getElementById("logout").onclick=logout;document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>choose(b.dataset.id,b))}
async function choose(id,b){b.disabled=true;try{await api("/api/select-guild",{method:"POST",body:JSON.stringify({guildId:id})});me=await api("/api/me");await loadMeta();dashboard()}catch(e){document.getElementById("err").textContent=niceError(e.message);b.disabled=false}}
function niceError(e){const map={login_required:"سجّل الدخول من جديد.",guild_not_selected:"اختر سيرفراً أولاً.",manage_guild_required:"تحتاج صلاحية إدارة السيرفر.",bot_missing_permissions:"البوت يحتاج صلاحيات في القناة المحددة.",invalid_channel:"اختر قناة نصية صحيحة.",add_at_least_one_option:"أضف خيار تكت واحداً على الأقل."};return map[e]||e||"حدث خطأ غير متوقع."}
async function loadMeta(){meta=await api("/api/ticket/meta");config=structuredClone(meta.config)}
function shell(){const g=me.guilds.find(x=>x.id===me.selectedGuildId);app.innerHTML=`<div class="layout"><aside><div class="brand"><img src="${logo}"><div><strong>TicketNXT</strong><small>لوحة إدارة البوت</small></div></div><nav class="nav"><button data-view="home">نظرة عامة</button><button data-view="editor">محرر التكت</button><button data-view="settings">الإعدادات</button></nav><div class="side-bottom">إصدار النظام<strong>v0.2.0 · Development</strong></div></aside><main><div class="top"><div><div class="eyebrow">TICKETNXT / CONTROL CENTER</div><h1 id="heading">نظرة عامة</h1></div><div class="top-actions"><b>${esc(g?.name||meta.guild.name)}</b><button class="btn secondary small" id="switch">تغيير السيرفر</button><button class="btn secondary small" id="logout2">خروج</button></div></div><section id="home" class="view"><div class="welcome"><span class="pill">متصل</span><h2>مركز إدارة التذاكر</h2><p>تم ربط البوت بالسيرفر. أنشئ لوحة تكت، اضبط خياراتها، ثم انشرها في القناة المناسبة.</p></div><div class="cards"><div class="metric-card">حالة البوت<div class="metric" id="bot">جارٍ الفحص...</div><div class="muted">اتصال Discord</div></div><div class="metric-card">لوحة التكت<div class="metric">${config.panelMessageId?"منشورة":"غير منشورة"}</div><div class="muted">${config.panelChannelId?"قناة: "+esc(meta.channels.find(c=>c.id===config.panelChannelId)?.name||"محددة"):"لم يتم اختيار قناة"}</div></div><div class="metric-card">خيارات التكت<div class="metric">${config.panel.options.length}</div><div class="muted">قابلة للتخصيص</div></div></div><div class="notice">ابدأ من محرر التكت. احفظ إعداداتك قبل النشر، ويمكنك تعديل اللوحة المنشورة وإعادة تحديثها لاحقاً.</div></section><section id="editor" class="view"><div id="editorMount"></div></section><section id="settings" class="view"><div id="settingsMount"></div></section></main></div>`;document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));document.getElementById("switch").onclick=()=>guilds(me);document.getElementById("logout2").onclick=logout;showView(currentView);refreshStatus()}
function showView(view){currentView=view;document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active",s.id===view));document.getElementById("heading").textContent=({home:"نظرة عامة",editor:"محرر لوحة التكت",settings:"إعدادات النظام"})[view];if(view==="editor")renderEditor();if(view==="settings")renderSettings()}
async function refreshStatus(){try{const s=await api("/api/status");const el=document.getElementById("bot");if(el)el.textContent=s.bot==="online"?"متصل":"غير متصل"}catch{}}
function roleOptions(selected=[]){return meta.roles.map(r=>`<option value="${esc(r.id)}" ${selected.includes(r.id)?"selected":""}>${esc(r.name)}</option>`).join("")}
function categoryOptions(selected){return '<option value="">بدون تصنيف</option>'+meta.categories.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
function emojiOptions(current){const basics=["🎫","🛠️","🛒","💳","📦","❓","📩","🧾","⚙️","🚨","💬","⭐"];const all=[...new Set([...basics,...meta.emojis.map(e=>e.value),current].filter(Boolean))];return '<option value="">بدون</option>'+all.map(v=>`<option value="${esc(v)}" ${current===v?"selected":""}>${esc(v)}</option>`).join("")}
function renderEditor(){const p=config.panel;document.getElementById("editorMount").innerHTML=`<div class="editor-grid"><div class="stack"><div class="panel"><div class="section-head"><h3>تصميم لوحة التكت</h3><span class="pill">معاينة مباشرة</span></div><div class="field-grid" style="margin-top:14px"><div class="field"><label>عنوان اللوحة</label><input data-panel="title" maxlength="250" value="${esc(p.title)}"></div><div class="field"><label>لون اللوحة</label><input data-panel="accentColor" type="color" value="${esc(p.accentColor)}" style="height:42px;padding:4px"></div><div class="field full"><label>الوصف</label><textarea data-panel="description" maxlength="3500">${esc(p.description)}</textarea></div><div class="field"><label>نوع الرسالة</label><select data-panel="mode"><option value="embed" ${p.mode==="embed"?"selected":""}>Embed تقليدي</option><option value="components" ${p.mode==="components"?"selected":""}>Components V2</option></select></div><div class="field"><label>طريقة عرض الخيارات</label><select data-panel="optionDisplay"><option value="buttons" ${p.optionDisplay==="buttons"?"selected":""}>أزرار</option><option value="select" ${p.optionDisplay==="select"?"selected":""}>قائمة اختيار</option></select></div><div class="field full"><label>رابط صورة (اختياري)</label><input data-panel="imageUrl" type="url" placeholder="https://..." value="${esc(p.imageUrl||"")}"><small>استخدم رابط صورة مباشر يبدأ بـ https://</small></div></div></div><div class="panel"><div class="section-head"><h3>خيارات فتح التكت</h3><button class="btn small" id="addOption">＋ إضافة خيار</button></div><p class="subtle">كل خيار له إعداداته الخاصة: رتبة الدعم، الرتب المسموح لها، السؤال، التصنيف، ووقت الإغلاق التلقائي.</p><div id="optionsMount"></div></div><div class="panel"><h3>نشر اللوحة</h3><div class="field"><label>القناة النصية</label><select id="publishChannel"><option value="">اختر قناة</option>${meta.channels.map(c=>`<option value="${esc(c.id)}" ${config.panelChannelId===c.id?"selected":""}># ${esc(c.name)}</option>`).join("")}</select></div><div class="toolbar"><button class="btn" id="saveConfig">حفظ الإعدادات</button><button class="btn secondary" id="publishPanel">نشر / تحديث اللوحة</button></div><div class="status" id="editorStatus"></div><div class="subtle">يحتاج البوت صلاحيات إدارة القنوات والأدوار، وإرسال الرسائل، وإرفاق الملفات، وقراءة سجل الرسائل في القنوات المستخدمة.</div></div></div><div class="preview-wrap"><div class="panel"><h3>المعاينة</h3><div class="discord-preview" id="livePreview"></div><div class="preview-caption">معاينة تقريبية. قد يختلف العرض النهائي قليلاً بين Discord على الكمبيوتر والجوال.</div></div></div></div>`;renderOptions();renderPreview();document.querySelectorAll("[data-panel]").forEach(el=>{el.addEventListener("input",()=>{config.panel[el.dataset.panel]=el.value;renderPreview()});el.addEventListener("change",()=>{config.panel[el.dataset.panel]=el.value;renderPreview()})});document.getElementById("addOption").onclick=()=>{if(config.panel.options.length>=25)return status("editorStatus","الحد الأقصى 25 خياراً.");config.panel.options.push({id:cryptoId(),label:"قسم جديد",description:"",emoji:"🎫",supportRoleIds:[],allowedRoleIds:[],categoryId:null,askReason:false,askReasonPrompt:"ما سبب فتح التذكرة؟",autoCloseMinutes:0,channelNameTemplate:"ticket-{number}"});renderOptions();renderPreview()};document.getElementById("saveConfig").onclick=saveConfig;document.getElementById("publishPanel").onclick=publishPanel}
function cryptoId(){return "opt"+Math.random().toString(36).slice(2,10)}
function renderOptions(){const mount=document.getElementById("optionsMount");if(!mount)return;mount.innerHTML=config.panel.options.map((o,i)=>`<div class="option-card" data-option="${i}"><div class="option-head"><strong>الخيار ${i+1}</strong><button class="btn ghost small" data-move="-1" data-i="${i}" ${i===0?"disabled":""}>↑</button><button class="btn ghost small" data-move="1" data-i="${i}" ${i===config.panel.options.length-1?"disabled":""}>↓</button><button class="btn danger small" data-remove="${i}" ${config.panel.options.length===1?"disabled":""}>حذف</button></div><div class="field-grid"><div class="field"><label>اسم الخيار</label><input data-field="label" data-i="${i}" value="${esc(o.label)}" maxlength="80"></div><div class="field"><label>الإيموجي</label><select data-field="emoji" data-i="${i}">${emojiOptions(o.emoji)}</select></div><div class="field full"><label>وصف الخيار</label><input data-field="description" data-i="${i}" value="${esc(o.description)}" maxlength="100"></div><div class="field"><label>رتب الدعم (يمكن اختيار أكثر من رتبة)</label><select multiple data-field="supportRoleIds" data-i="${i}">${roleOptions(o.supportRoleIds)}</select></div><div class="field"><label>الرتب المسموح لها بفتح هذا الخيار</label><select multiple data-field="allowedRoleIds" data-i="${i}">${roleOptions(o.allowedRoleIds)}</select><small>اتركها فارغة للسماح للجميع.</small></div><div class="field"><label>تصنيف قناة التكت</label><select data-field="categoryId" data-i="${i}">${categoryOptions(o.categoryId)}</select></div><div class="field"><label>قالب اسم القناة</label><input data-field="channelNameTemplate" data-i="${i}" value="${esc(o.channelNameTemplate)}"><small>{number} رقم التذكرة · {username} اسم العضو</small></div><div class="field"><label>الإغلاق التلقائي بعد (بالدقائق)</label><input type="number" min="0" max="525600" data-field="autoCloseMinutes" data-i="${i}" value="${Number(o.autoCloseMinutes)||0}"><small>0 = معطّل. يعتمد على نشاط الرسائل.</small></div><div class="field"><label>نص سؤال سبب التذكرة</label><input data-field="askReasonPrompt" data-i="${i}" value="${esc(o.askReasonPrompt)}" maxlength="120"></div><div class="field full"><label class="checkline"><input type="checkbox" data-field="askReason" data-i="${i}" ${o.askReason?"checked":""}> اسأل العضو عن سبب فتح التذكرة قبل إنشائها</label></div></div></div>`).join("");mount.querySelectorAll("[data-field]").forEach(el=>{const update=()=>{const i=Number(el.dataset.i),field=el.dataset.field;config.panel.options[i][field]=el.type==="checkbox"?el.checked:el.multiple?[...el.selectedOptions].map(x=>x.value):field==="autoCloseMinutes"?Number(el.value):el.value;renderPreview()};el.addEventListener("input",update);el.addEventListener("change",update)});mount.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{config.panel.options.splice(Number(b.dataset.remove),1);renderOptions();renderPreview()});mount.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i),j=i+Number(b.dataset.move);[config.panel.options[i],config.panel.options[j]]=[config.panel.options[j],config.panel.options[i]];renderOptions();renderPreview()})}
function renderPreview(){const el=document.getElementById("livePreview");if(!el)return;const p=config.panel;const image=p.imageUrl&&/^https:\/\//i.test(p.imageUrl)?`<img src="${esc(p.imageUrl)}" alt=""> `:"";const controls=p.optionDisplay==="select"?`<div class="preview-select">اختر نوع التذكرة　⌄</div>`:`<div class="preview-options">${p.options.map(o=>`<span class="preview-option">${esc(o.emoji)} ${esc(o.label)}</span>`).join("")}</div>`;if(p.mode==="components"){el.innerHTML=`<div class="preview-v2"><div class="v2-accent" style="background:${esc(p.accentColor)}"></div><h3>${esc(p.title)}</h3><p style="white-space:pre-wrap;font-size:13px">${esc(p.description)}</p>${image}${controls}</div>`}else{el.innerHTML=`<div class="preview-author"><img src="${logo}"> TicketNXT</div><div class="preview-embed" style="border-color:${esc(p.accentColor)}"><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>${image}</div>${controls}`}}
function status(id,msg,ok=false){const el=document.getElementById(id);if(el){el.textContent=msg;el.className="status "+(ok?"published":"")}}
async function saveConfig(){try{status("editorStatus","جارٍ حفظ الإعدادات...");const result=await api("/api/ticket/config",{method:"PUT",body:JSON.stringify(config)});config=result.config;status("editorStatus","تم حفظ الإعدادات بنجاح.",true);return true}catch(e){status("editorStatus",niceError(e.message));return false}}
async function publishPanel(){try{const channelId=document.getElementById("publishChannel").value;if(!channelId)return status("editorStatus","اختر قناة النشر أولاً.");if(!await saveConfig())return;status("editorStatus","جارٍ نشر اللوحة...");const result=await api("/api/ticket/publish",{method:"POST",body:JSON.stringify({channelId})});config.panelChannelId=result.channelId;config.panelMessageId=result.messageId;status("editorStatus","تم نشر اللوحة بنجاح: "+result.url,true)}catch(e){status("editorStatus",niceError(e.message))}}
function renderSettings(){document.getElementById("settingsMount").innerHTML=`<div class="panel"><h3>رتب التجاوز</h3><p class="subtle">هذه الرتب تستطيع رؤية التذاكر حتى بعد استلامها، ويمكنها تنفيذ إجراءات الإدارة. أضف الرتب الموثوقة فقط.</p><div class="field"><label>رتب التجاوز</label><select id="overrideRoles" multiple>${roleOptions(config.overrideRoleIds||[])}</select></div><div class="toolbar"><button class="btn" id="saveSettings">حفظ الإعدادات</button></div><div class="status" id="settingsStatus"></div></div><div class="panel" style="margin-top:14px"><h3>معلومات الصلاحيات</h3><p class="subtle">يحتاج البوت صلاحية إدارة القنوات والأدوار، عرض القنوات، إرسال الرسائل، تضمين الروابط، إرفاق الملفات، وقراءة سجل الرسائل. يجب أن يكون دور البوت أعلى من رتب الدعم التي تريد التحكم بصلاحياتها.</p><p class="subtle">البيانات والإعدادات والجلسات تحفظ في مساحة الاستضافة، ولا تُرفع إلى مستودع GitHub.</p></div>`;document.getElementById("saveSettings").onclick=async()=>{config.overrideRoleIds=[...document.getElementById("overrideRoles").selectedOptions].map(o=>o.value);try{await api("/api/ticket/config",{method:"PUT",body:JSON.stringify(config)});status("settingsStatus","تم حفظ الإعدادات.",true)}catch(e){status("settingsStatus",niceError(e.message))}}}
async function logout(){await fetch("/auth/logout",{method:"POST",credentials:"same-origin"});login()}
(async()=>{try{me=await api("/api/me");if(!me.oauthConfigured)return login("يلزم إعداد مفاتيح Discord OAuth في الاستضافة.");if(!me.authenticated)return login(new URLSearchParams(location.search).has("login")?"تم إلغاء تسجيل الدخول.":"");if(me.selectedGuildId){await loadMeta();dashboard()}else guilds(me)}catch{login("تعذر تحميل لوحة التحكم. حدّث الصفحة.")}})();
function dashboard(){shell()}
</script></body></html>
